apiVersion: v1
kind: Pod
metadata:
  name: calculator-pod
  labels:
    app: calculator-app
spec:
  imagePullSecrets:
  - name: dockerhub-secret
  containers:
  - name: calculator-app
    image: manimaran04/calculator-app:v2
    ports:
    - containerPort: 5000
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "250m"
        memory: "256Mi"